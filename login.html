<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NicaGrow</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    <link rel="stylesheet" href="css/loginstyle.css">
</head>

<body>
    <!-- contenedor principal con login, registro y paneles laterales -->
    <div class="container">
        <!-- formulario para iniciar sesion -->
        <div class="form-box login">
            <form id="loginForm" novalidate>
                <h1>Iniciar sesión</h1>
                <p class="form-subtitle">Accede según el tipo de cuenta que registraste.</p>

                <div class="form-message" id="loginMessage" aria-live="polite"></div>

                <div class="input-box">
                    <input id="loginEmail" name="email" type="email" placeholder="Correo electrónico" required>
                    <i class="bi bi-envelope-fill"></i>
                </div>

                <div class="input-box">
                    <input id="loginPassword" name="password" type="password" placeholder="Contraseña" required>
                    <i class="bi bi-lock-fill"></i>
                </div>

                <div class="forgot-link">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn">Iniciar sesión</button>
            </form>
        </div>

        <!-- formulario para crear una cuenta nueva -->
        <div class="form-box register">
            <form id="registerForm" novalidate>
                <!-- primer paso para escoger comprador o vendedor -->
                <div class="register-step role-step active" data-step="roles">
                    <h1>Elige tu cuenta</h1>
                    <p class="form-subtitle">Selecciona cómo quieres usar NicaGrow antes de registrarte.</p>

                    <div class="form-message" id="registerRoleMessage" aria-live="polite"></div>

                    <div class="role-selector" id="roleSelector">
                        <button type="button" class="role-card" data-role="seller">
                            <i class="bi bi-shop-window"></i>
                            <span>Vendedor</span>
                            <small>Publica productos y administra ventas.</small>
                        </button>

                        <button type="button" class="role-card" data-role="buyer">
                            <i class="bi bi-bag-heart-fill"></i>
                            <span>Comprador</span>
                            <small>Explora productos nacionales.</small>
                        </button>
                    </div>

                    <input type="hidden" id="registerRole" name="role" required>

                    <button type="button" class="btn" id="continueRegisterBtn">Continuar</button>
                </div>

                <!-- segundo paso con los datos personales -->
                <div class="register-step details-step" data-step="details">
                    <div class="register-step-header">
                        <button type="button" class="step-back-btn" id="backToRolesBtn">
                            <i class="bi bi-arrow-left"></i>
                        </button>
                        <div>
                            <h1>Regístrate</h1>
                            <p class="selected-role-text">Cuenta seleccionada: <strong
                                    id="selectedRoleLabel">Vendedor</strong></p>
                        </div>
                    </div>

                    <div class="form-message" id="registerMessage" aria-live="polite"></div>

                    <div class="register-grid">
                        <div class="input-box">
                            <input id="firstName" name="firstName" type="text" placeholder="Nombre" required>
                        </div>

                        <div class="input-box">
                            <input id="lastName" name="lastName" type="text" placeholder="Apellidos" required>
                        </div>

                        <div class="input-box full-width">
                            <input id="registerEmail" name="email" type="email" placeholder="Correo electrónico"
                                required>
                            <i class="bi bi-envelope-fill"></i>
                        </div>

                        <div class="input-box full-width">
                            <input id="registerPassword" name="password" type="password" placeholder="Contraseña"
                                minlength="6" required>
                            <i class="bi bi-lock-fill"></i>
                        </div>

                        <div class="input-box">
                            <input id="birthDate" name="birthDate" type="date" required>
                        </div>

                        <div class="input-box">
                            <input id="phone" name="phone" type="tel" placeholder="Número telefónico" required>
                        </div>

                        <div class="input-box full-width">
                            <select id="city" name="city" required>
                                <option value="">Selecciona tu ciudad</option>
                                <option value="BO">Boaco</option>
                                <option value="CA">Carazo</option>
                                <option value="CH">Chinandega</option>
                                <option value="CHO">Chontales</option>
                                <option value="ES">Esteli</option>
                                <option value="GR">Granada</option>
                                <option value="JN">Jinotega</option>
                                <option value="L">Leon</option>
                                <option value="MD">Madriz</option>
                                <option value="M">Managua</option>
                                <option value="MY">Masaya</option>
                                <option value="MT">Matagalpa</option>
                                <option value="RI">Rivas</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn">Crear cuenta</button>
                </div>
            </form>
        </div>

        <!-- paneles para cambiar entre registro e inicio de sesion -->
        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Hola, bienvenido</h1>
                <p>¿No tienes una cuenta?</p>
                <button class="btn register-btn" type="button">Registrarse</button>
            </div>
            <div class="toggle-panel toggle-right">
                <h1>Bienvenido de nuevo</h1>
                <p>¿Ya tienes una cuenta?</p>
                <button class="btn login-btn" type="button">Iniciar sesión</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
