<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">

    <link rel="stylesheet" href="css/loginstyle.css">
</head>

<body>
    <div class="container">
        <div class="form-box login">
            <form action="">
                <h1>Iniciar sesión</h1>
                <div class="input-box">
                    <input type="text" placeholders="Correo electrónico" required>
                    <i class="bi bi-person-fill"></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholders="Contraseña" required>
                    <i class="bi bi-lock-fill"></i>
                </div>
                <div class="forgot-link">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                    <button type="submit" class="btn">
                        Iniciar sesión
                    </button>
                    <p>Iniciar sesión con otras plataformas</p>
                    <div class="social-icons">
                        <a href="#"><i class="bi bi-google"></i></a>
                        <a href="#"><i class="bi bi-facebook"></i></a>
                    </div>
                </div>
            </form>
        </div>
        <div class="form-box register">
            <form action="">
                <h1>Regístrate</h1>

                <div class="register-grid">

                    <div class="input-box">
                        <input type="text" placeholder="Nombre" required>
                    </div>

                    <div class="input-box">
                        <input type="text" placeholder="Apellidos" required>
                    </div>

                    <div class="input-box full-width">
                        <input type="text" placeholder="Correo electrónico" required>
                        <i class="bi bi-person-fill"></i>
                    </div>

                    <div class="input-box full-width">
                        <input type="password" placeholder="Contraseña" required>
                        <i class="bi bi-lock-fill"></i>
                    </div>

                    <div class="input-box">
                        <input type="date" required>
                    </div>

                    <div class="input-box">
                        <input type="text" placeholder="Número telefónico" required>
                    </div>

                    <div class="input-box full-width">
                        <input type="text" placeholder="Ciudad" required>
                    </div>

                </div>

                <button type="submit" class="btn">
                    Registrarse
                </button>

                <p>Registrarse con otras plataformas</p>

                <div class="social-icons">
                    <a href="#"><i class="bi bi-google"></i></a>
                    <a href="#"><i class="bi bi-facebook"></i></a>
                </div>
            </form>
        </div>

        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Hola, Bienvenido</h1>
                <p>¿No tienes una cuenta?</p>
                <button class="btn register-btn">
                    Registrarse
                </button>
            </div>
            <div class="toggle-panel toggle-right">
                <h1>Bienvenido</h1>
                <p>¿Ya tienes una cuenta?</p>
                <button class="btn login-btn">
                    Iniciar sesión
                </button>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>

</body>

</html>
